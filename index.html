<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ObeyPunks - Whitelist</title>
  <style>
    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .box {
      background: #111111;
      border: 2px solid #ff6600;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
    }
    h1, h2 {
      text-align: center;
      color: #ff6600;
    }
    .tasks ul {
      list-style: none;
      padding: 0;
    }
    .tasks li {
      padding: 12px 0;
      border-bottom: 1px solid #222;
    }
    .tasks li:last-child {
      border-bottom: none;
    }
    a {
      color: #ffaa00;
      text-decoration: underline;
    }
    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background: #1a1a1a;
      border: 2px solid #ff6600;
      color: white;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 18px;
      background: #ff6600;
      color: black;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Limited Spots -->
    <div class="box">
      <h2>LIMITED SPOTS</h2>
      <p style="text-align:center;">Complete the social tasks below and submit your wallet.</p>
    </div>

    <!-- Social Tasks -->
    <div class="box tasks">
      <h2>SOCIAL TASKS</h2>
      <ul>
        <li>• Follow <a href="https://x.com/ObeyPunks" target="_blank">@ObeyPunks</a> on X</li>
        <li>• Like & Repost the <a href="https://x.com/ObeyPunks/status/YOUR_PINNED_POST_ID" target="_blank">Pinned Post</a></li>
        <li>• Comment your wallet address on the pinned post</li>
      </ul>
    </div>

    <!-- Submit Wallet -->
    <div class="box">
      <h2>SUBMIT WALLET</h2>
      <form action="https://formspree.io/f/mvzyybla" method="POST">
        <input type="text" name="x_username" placeholder="@Your X Username" required>
        <input type="text" name="wallet_address" placeholder="0xYour Wallet Address" required>
        <button type="submit">SUBMIT WHITELIST</button>
      </form>
    </div>

    <p style="text-align: center; margin-top: 30px; opacity: 0.6; font-size: 14px;">
      ObeyPunks Whitelist
    </p>

  </div>
</body>
</html>
